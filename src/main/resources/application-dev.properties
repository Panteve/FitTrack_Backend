spring.datasource.url=jdbc:postgresql://localhost:5432/fittrack
spring.datasource.username=postgres
spring.datasource.password=Colombia123
spring.datasource.driver-class-name=org.postgresql.Driver

# Postman (y cualquier cliente con keep-alive) reutiliza del pool un socket que Tomcat
# ya cerro durante una pausa, y la siguiente peticion muere con "read ECONNRESET".
# Con 30 minutos de timeout la conexion sigue viva durante toda la sesion de desarrollo.
# En produccion NO copies este valor: ahi interesa cerrar conexiones ociosas pronto.
server.tomcat.keep-alive-timeout=1800000

spring.jpa.hibernate.ddl-auto=update